<section class="auth-panel" aria-labelledby="recovery-title"><div class="auth-card">
    <div class="eyebrow">ACCOUNT / RECOVERY</div>
    <h2 id="recovery-title">找回密码</h2>
    <p class="auth-subtitle" id="recovery-intro">输入注册邮箱并完成图形验证，获取邮件验证码。</p>
    <ol class="recovery-steps" aria-label="找回密码进度">
      <li id="recovery-email-indicator" aria-current="step"><span>1</span>验证邮箱</li>
      <li id="recovery-reset-indicator"><span>2</span>设置新密码</li>
    </ol>
    <p class="preview-notice" id="recovery-preview-note">预览可使用 name@example.test。邮件验证码为 123456，请使用测试密码。</p>
    <form id="recovery-email-form">
      <div class="form-field">
        <label for="recovery-email">注册邮箱</label>
        <div class="input-wrap recovery-input"><input id="recovery-email" type="email" autocomplete="email" placeholder="name@example.com" required disabled></div>
      </div>
      <div class="form-field">
        <label for="recovery-captcha">图形验证码</label>
        <div class="recovery-captcha-row">
          <div class="input-wrap recovery-input"><input id="recovery-captcha" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" required disabled></div>
          <div class="recovery-captcha-display">
            <img id="recovery-captcha-image" alt="图形验证挑战" hidden>
            <span id="recovery-captcha-sample" class="account-captcha-sample" aria-hidden="true" hidden></span>
          </div>
          <button class="recovery-secondary" id="recovery-refresh" type="button" disabled>换一张</button>
        </div>
      </div>
      <button class="button auth-submit" id="recovery-send" type="submit" disabled>发送邮件验证码 <span aria-hidden="true">↗</span></button>
      <button class="recovery-link" id="recovery-cancel-resend" type="button" hidden>返回输入邮件验证码</button>
    </form>
    <form id="recovery-reset-form" hidden>
      <p class="recovery-destination"><strong id="recovery-destination"></strong><button class="recovery-link" id="recovery-change-email" type="button">更换邮箱</button></p>
      <div class="form-field">
        <label for="recovery-email-code">邮件验证码</label>
        <div class="recovery-code-row">
          <div class="input-wrap recovery-input"><input id="recovery-email-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required disabled></div>
          <button class="recovery-secondary" id="recovery-resend" type="button" disabled>重新发送</button>
        </div>
      </div>
      <div class="form-field">
        <label for="recovery-new-password">新密码</label>
        <div class="input-wrap recovery-input recovery-password">
          <input id="recovery-new-password" type="password" autocomplete="new-password" minlength="6" aria-describedby="recovery-password-hint" required disabled>
          <button type="button" class="recovery-visibility" data-recovery-password="recovery-new-password" aria-pressed="false" disabled>显示</button>
        </div>
        <p class="recovery-field-hint" id="recovery-password-hint">至少 6 个字符。</p>
      </div>
      <div class="form-field">
        <label for="recovery-repeat-password">确认新密码</label>
        <div class="input-wrap recovery-input recovery-password">
          <input id="recovery-repeat-password" type="password" autocomplete="new-password" minlength="6" required disabled>
          <button type="button" class="recovery-visibility" data-recovery-password="recovery-repeat-password" aria-pressed="false" disabled>显示</button>
        </div>
      </div>
      <button class="button auth-submit" id="recovery-submit" type="submit" disabled>重置密码 <span aria-hidden="true">↗</span></button>
    </form>
    <p class="form-status" id="recovery-status" role="status" aria-live="polite" hidden></p>
    <a class="recovery-link recovery-back" id="recovery-back" href="/login">← 返回登录</a>
    <noscript><p class="field-error">请启用 JavaScript 后使用账户恢复。</p></noscript>
</div></section>
