# Merge these locations into the existing server block using the dist/ document root.
# Keep existing API, auth, callback and account route handlers. Protect dashboard
# routes using the existing auth gateway before serving the corresponding HTML.
location ~ ^(/en)?/tools/(proxy-checker|device-checker)/?$ {
    return 302 $1/$2$is_args$args;
}
location = /en { return 308 /en/; }
location / {
    try_files $uri $uri.html $uri/index.html $uri/ =404;
}
