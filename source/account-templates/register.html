<section class="auth-panel" aria-labelledby="register-title"><div class="auth-card register-card">
    <div class="eyebrow">ACCOUNT / CREATE</div>
    <h2 id="register-title">注册REDROCK账号</h2>
    <p class="auth-subtitle" id="register-intro">验证邮箱并设置密码，即可创建账户。</p>
    <p class="preview-notice" id="register-preview-note">预览可使用 name@example.test。邮件验证码为 123456，请使用测试密码。</p>
    <form id="register-form">
      <div class="form-field">
        <label for="register-email">邮箱地址</label>
        <div class="input-wrap recovery-input"><input id="register-email" type="email" autocomplete="email" placeholder="name@example.com" required disabled></div>
      </div>
      <div class="form-field">
        <label for="register-captcha">图形验证码</label>
        <div class="recovery-captcha-row">
          <div class="input-wrap recovery-input"><input id="register-captcha" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" required disabled></div>
          <div class="recovery-captcha-display">
            <img id="register-captcha-image" alt="图形验证挑战" hidden>
            <span id="register-captcha-sample" class="account-captcha-sample" aria-hidden="true" hidden></span>
          </div>
          <button class="recovery-secondary" id="register-refresh" type="button" disabled>换一张</button>
        </div>
      </div>
      <div class="form-field">
        <label for="register-code">邮件验证码</label>
        <div class="recovery-code-row">
          <div class="input-wrap recovery-input"><input id="register-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required disabled></div>
          <button class="recovery-secondary" id="register-send" type="button" disabled>发送邮件验证码</button>
        </div>
      </div>
      <div class="register-password-fields">
        <div class="form-field">
          <label for="register-password">密码</label>
          <div class="input-wrap recovery-input recovery-password">
            <input id="register-password" type="password" autocomplete="new-password" minlength="6" aria-describedby="register-password-hint" required disabled>
            <button type="button" class="recovery-visibility" data-register-password="register-password" aria-pressed="false" disabled>显示</button>
          </div>
          <p class="recovery-field-hint" id="register-password-hint">至少 6 个字符。</p>
        </div>
        <div class="form-field">
          <label for="register-repeat-password">确认密码</label>
          <div class="input-wrap recovery-input recovery-password">
            <input id="register-repeat-password" type="password" autocomplete="new-password" minlength="6" required disabled>
            <button type="button" class="recovery-visibility" data-register-password="register-repeat-password" aria-pressed="false" disabled>显示</button>
          </div>
        </div>
      </div>
      <div class="form-field">
        <label for="register-invite">邀请码（选填）</label>
        <div class="input-wrap recovery-input"><input id="register-invite" type="text" autocomplete="off" maxlength="128" disabled></div>
      </div>
      <div class="remember register-consent">
        <input id="register-terms" type="checkbox" aria-labelledby="register-terms-label" required disabled>
        <span id="register-terms-label"><label for="register-terms">我已阅读并同意</label> <a href="https://redrock-ip.com/terms" target="_blank" rel="noopener">服务条款</a> 和 <a href="https://redrock-ip.com/privacy" target="_blank" rel="noopener">隐私政策</a>。</span>
      </div>
      <button class="button auth-submit" id="register-submit" type="submit" disabled>创建账户 <span aria-hidden="true">↗</span></button>
    </form>
    <p class="form-status" id="register-status" role="status" aria-live="polite" hidden></p>
    <a class="recovery-link recovery-back" id="register-back" href="/login">← 返回登录</a>
    <noscript><p class="field-error">请启用 JavaScript 后注册账户。</p></noscript>
</div></section>
