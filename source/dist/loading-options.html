<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090708">
  <meta name="robots" content="noindex">
  <title>加载动效对比 · REDROCK</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/loading-spinner.css">
  <style>
    body {
      background: #090708;
      color: #fff3f4;
    }
    .loading-gallery {
      width: min(100% - 32px, 930px);
      margin-inline: auto;
      padding: clamp(24px, 6vw, 65px) 0 36px;
    }
    .loading-gallery-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 16px;
      margin-bottom: 18px;
    }
    .loading-gallery-heading h1 { margin: 0; font-size: clamp(23px, 4vw, 34px); line-height: 1.25; }
    .loading-gallery .header-actions { flex-wrap: wrap; gap: 8px; }
    .loading-gallery-control {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 5px 11px;
      border: 1px solid #49323b;
      border-radius: 6px;
      background: #160f14;
      color: #f3dce1;
      font-size: 13px;
    }
    .loading-gallery-control:hover { border-color: #b16576; }
    .loading-gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }
    .loading-sample {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #36252c;
      border-radius: 10px;
      background: #140e12;
    }
    .loading-sample:hover { border-color: #a25366; }
    .loading-sample-tile {
      display: grid;
      min-height: clamp(112px, 21vw, 180px);
      place-items: center;
      border-bottom: 1px solid #302027;
      background: #090708;
    }
    .loading-sample-caption {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 2px 10px;
      padding: 11px 13px;
    }
    .loading-sample-caption h2 { margin: 0; font-size: 14px; }
    .loading-sample-caption span { color: #d1b0be; font-size: 12px; }
    @media (max-width: 450px) {
      .loading-gallery-grid { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
<link data-locale-alternate rel="alternate" hreflang="zh-CN" href="/loading-options"><link data-locale-alternate rel="alternate" hreflang="en" href="/en/loading-options"><link rel="stylesheet" href="locale.css"></head>
<body>
  <main class="loading-gallery">
    <div class="loading-gallery-heading">
      <h1>加载动效对比</h1>
      <div class="header-actions"><a class="language-switch" data-language-switch href="/en/loading-options" hreflang="en" lang="en" aria-label="切换为英文">EN</a>
        <button class="loading-gallery-control" id="loading-motion" type="button" aria-pressed="true">暂停动效</button>
        <a class="loading-gallery-control" href="/payment-preview?stage=loading&amp;play=1&amp;destination=orders">模拟慢速打开订单</a>
        <a class="loading-gallery-control" href="/payment-preview?stage=loading&amp;play=1&amp;destination=usage">模拟慢速打开用量</a>
      </div>
    </div>
    <div class="loading-gallery-grid">
      <a class="loading-sample" href="/payment-preview?stage=loading&amp;spinner=arc">
        <div class="loading-sample-tile" aria-hidden="true"><span class="loading-spinner" data-spinner="arc"></span></div>
        <div class="loading-sample-caption"><h2>细线弧环</h2><span>全屏查看</span></div>
      </a>
      <a class="loading-sample" href="/payment-preview?stage=loading&amp;spinner=comet">
        <div class="loading-sample-tile" aria-hidden="true"><span class="loading-spinner" data-spinner="comet"></span></div>
        <div class="loading-sample-caption"><h2>渐变流光环</h2><span>全屏查看</span></div>
      </a>
      <a class="loading-sample" href="/payment-preview?stage=loading&amp;spinner=dual">
        <div class="loading-sample-tile" aria-hidden="true"><span class="loading-spinner" data-spinner="dual"></span></div>
        <div class="loading-sample-caption"><h2>双轨弧线</h2><span>全屏查看</span></div>
      </a>
      <a class="loading-sample" href="/payment-preview?stage=loading&amp;spinner=dots">
        <div class="loading-sample-tile" aria-hidden="true"><span class="loading-spinner" data-spinner="dots"></span></div>
        <div class="loading-sample-caption"><h2>环形点阵</h2><span>全屏查看</span></div>
      </a>
    </div>
  </main>
  <script>
    (() => {
      const root = document.documentElement;
      const button = document.getElementById('loading-motion');
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !preference.matches;
      try {
        const saved = localStorage.getItem('redrock-motion');
        if (saved) playing = saved === 'on';
      } catch { /* Follow the system preference. */ }

      function showMotion() {
        root.dataset.motion = playing ? 'on' : 'off';
        button.setAttribute('aria-pressed', String(playing));
        button.textContent = playing ? '暂停动效' : '开启动效';
      }
      button.addEventListener('click', () => {
        playing = !playing;
        showMotion();
      });
      showMotion();
    })();
  </script>
<script src="language-switch.js"></script></body>
</html>
