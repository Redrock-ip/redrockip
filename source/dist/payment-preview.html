<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090708">
  <meta name="robots" content="noindex">
  <title>付款流程预览 · REDROCK</title>
  <script>
    if (new URLSearchParams(location.search).get('stage') === 'loading') {
      document.documentElement.dataset.paymentLoading = '';
    }
  </script>
  <link rel="icon" href="/assets/logo.jpg">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/payment-preview.css">
  <link rel="stylesheet" href="/loading-spinner.css">
<link data-locale-alternate rel="alternate" hreflang="zh-CN" href="/payment-preview"><link data-locale-alternate rel="alternate" hreflang="en" href="/en/payment-preview"><link rel="stylesheet" href="locale.css"></head>
<body class="payment-preview">
  <a class="skip-link" href="#main">跳转到付款预览</a>
  <header class="payment-preview-header">
    <a href="/" class="brand" aria-label="REDROCK 首页">
      <img class="original-logo" src="/assets/logo.jpg" width="40" height="40" alt="">
      <span class="original-wordmark"><span class="wordmark-red">RED</span><span class="wordmark-rock">ROCK</span></span>
    </a>
    <a class="text-link" href="/dashboard">返回控制台 ↗</a>
  </header>
  <main id="main" class="payment-preview-main">
    <div class="payment-launcher" id="payment-launcher">
      <h1>付款流程预览</h1>
      <button class="button payment-action" type="button" id="payment-open">打开付款预览 <span aria-hidden="true">↗</span></button>
      <a class="loading-preview-link" href="/loading-options">查看加载动效</a>
      <noscript><p>请开启 JavaScript 以查看付款预览。</p></noscript>
    </div>

    <div class="page-loading-preview" id="page-loading-preview" role="progressbar" aria-label="正在加载页面" hidden>
      <span class="loading-spinner" data-spinner="dual" aria-hidden="true"></span>
    </div>

    <dialog id="payment-window" class="payment-window" aria-labelledby="payment-connect-title" data-payment-status="pending">
      <div class="payment-window-top">
        <p class="payment-preview-tag">示例订单</p>
        <div class="header-actions"><a class="language-switch" data-language-switch href="/en/payment-preview" hreflang="en" lang="en" aria-label="切换为英文">EN</a><button type="button" class="payment-close" id="payment-close" aria-label="关闭付款预览">×</button></div>
      </div>

      <div class="payment-status-row">
        <div>
          <section data-payment-stage="connect" id="payment-connect">
            <h2 id="payment-connect-title" tabindex="-1">正在连接外部收银台</h2>
            <p>正在准备支付链接。准备就绪后，将打开支付服务页面。</p>
          </section>
          <section data-payment-stage="return" id="payment-return" hidden>
            <h2 id="payment-return-title" tabindex="-1">正在确认支付结果</h2>
            <p>收到收银台的支付结果后，此窗口将自动更新。</p>
          </section>
          <section data-payment-stage="complete" id="payment-complete" hidden>
            <h2 id="payment-complete-title" tabindex="-1">支付成功</h2>
            <p>订单已确认收款。</p>
          </section>
        </div>
        <span class="payment-status-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="payment-status-badge"><i aria-hidden="true"></i>已支付</span>
      </div>

      <dl class="payment-details">
        <div><dt>订单编号</dt><dd>DEMO-P042</dd></div>
        <div><dt>订单金额</dt><dd>$50.00</dd></div>
      </dl>
      <div class="payment-footer">
        <button type="button" class="button payment-action" id="payment-forward">模拟从收银台返回 <span aria-hidden="true">→</span></button>
        <button type="button" class="button payment-action" id="payment-confirm" hidden>模拟支付完成 <span aria-hidden="true">→</span></button>
        <button type="button" class="button payment-action payment-replay" id="payment-replay" hidden>重新体验 <span aria-hidden="true">↻</span></button>
        <button type="button" class="payment-motion" id="payment-motion" aria-pressed="false"><span id="payment-motion-icon" aria-hidden="true">▷</span><span id="payment-motion-label">开启动效</span></button>
        <a class="loading-preview-link" href="/dashboard/purchase?demo=1&amp;tab=dynamic">体验模拟购买</a>
      </div>
    </dialog>
  </main>
  <script src="/payment-preview.js"></script>
<script src="language-switch.js"></script></body>
</html>
